<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order — MAYUR SERVICES</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#050509;
color:#fff;
min-height:100vh;
padding:35px 15px;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
width:550px;height:550px;
left:-250px;top:-200px;
background:#714cff;
filter:blur(150px);
opacity:.18;
animation:orb 8s infinite alternate;
z-index:-1;
}

body:after{
content:"";
position:fixed;
width:500px;height:500px;
right:-250px;bottom:-220px;
background:#00c8ff;
filter:blur(160px);
opacity:.12;
animation:orb2 10s infinite alternate;
z-index:-1;
}

@keyframes orb{to{transform:translate(220px,160px) scale(1.2)}}
@keyframes orb2{to{transform:translate(-180px,-130px) scale(1.2)}}

.box{
max-width:720px;
margin:auto;
padding:38px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-radius:30px;
backdrop-filter:blur(25px);
box-shadow:0 30px 100px rgba(0,0,0,.55);
animation:pageIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes pageIn{
from{opacity:0;transform:translateY(45px) scale(.94);filter:blur(10px)}
to{opacity:1;transform:none;filter:none}
}

.top{text-align:center;margin-bottom:32px}
.logo{
font-size:12px;
letter-spacing:4px;
color:#a98cff;
font-weight:bold;
}
h1{font-size:40px;margin:12px 0}
.sub{color:#888;line-height:1.6}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:17px;
}

.full{grid-column:1/-1}

label{
display:block;
font-size:12px;
color:#aaa;
margin-bottom:7px;
}

input,select,textarea{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid #292934;
background:#0b0b11;
color:#fff;
outline:none;
transition:.35s;
}

input:focus,select:focus,textarea:focus{
border-color:#8064ff;
box-shadow:0 0 0 3px rgba(128,100,255,.12),0 0 25px rgba(128,100,255,.08);
transform:translateY(-2px);
}

textarea{
min-height:140px;
resize:vertical;
}

.submit{
width:100%;
padding:16px;
border:0;
border-radius:14px;
background:linear-gradient(135deg,#704dff,#a170ff);
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
position:relative;
overflow:hidden;
transition:.4s;
}

.submit:hover{
transform:translateY(-5px);
box-shadow:0 20px 50px rgba(110,70,255,.3);
}

.submit:after{
content:"";
position:absolute;
top:0;
left:-120%;
width:70%;
height:100%;
background:rgba(255,255,255,.22);
transform:skewX(-20deg);
transition:.7s;
}

.submit:hover:after{left:150%}

.success{
display:none;
margin-top:20px;
padding:18px;
border-radius:15px;
background:rgba(40,220,130,.08);
border:1px solid rgba(40,220,130,.3);
color:#8ff0bb;
text-align:center;
animation:success .5s ease;
}

@keyframes success{
from{opacity:0;transform:scale(.9)}
to{opacity:1;transform:scale(1)}
}

.back{
display:block;
text-align:center;
margin-top:22px;
color:#777;
text-decoration:none;
transition:.3s;
}

.back:hover{color:#fff;transform:translateY(-2px)}

@media(max-width:600px){
.box{padding:28px 18px}
.form{grid-template-columns:1fr}
.full{grid-column:auto}
h1{font-size:32px}
}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div class="logo">✦ MAYUR SERVICES</div>
<h1>Start Your Project</h1>
<div class="sub">
Fill the details below and tell us exactly what you need.
</div>
</div>

<form id="orderForm">

<div class="form">

<div>
<label>Full Name *</label>
<input id="name" required placeholder="Enter your name">
</div>

<div>
<label>WhatsApp Number *</label>
<input id="phone" required maxlength="10" inputmode="numeric" placeholder="10-digit number">
</div>

<div>
<label>Email Address</label>
<input id="email" type="email" placeholder="you@example.com">
</div>

<div>
<label>City / Location</label>
<input id="city" placeholder="Your city">
</div>

<div>
<label>Service *</label>
<select id="service" required>
<option value="">Choose a service</option>
<option>Website Design</option>
<option>Resume / CV</option>
<option>Poster Design</option>
<option>Instagram Post</option>
<option>Photo Editing</option>
</select>
</div>

<div>
<label>Budget</label>
<select id="budget">
<option>Not decided</option>
<option>₹99 - ₹199</option>
<option>₹200 - ₹499</option>
<option>₹500 - ₹999</option>
<option>₹1000+</option>
</select>
</div>

<div>
<label>Delivery</label>
<select id="delivery">
<option>Normal</option>
<option>Urgent</option>
</select>
</div>

<div class="full">
<label>Requirement *</label>
<textarea id="requirement" required placeholder="Describe your project..."></textarea>
</div>

<div class="full">
<button class="submit" type="submit">
🚀 Submit Order & Continue
</button>
</div>

</div>
</form>

<div id="success" class="success">
✅ Order created successfully!<br>
Opening WhatsApp...
</div>

<a class="back" href="/">← Back to website</a>

</div>

<script>

const params=new URLSearchParams(location.search);
const selected=params.get("service");

if(selected){
document.getElementById("service").value=selected;
}

document.getElementById("orderForm").addEventListener("submit",async e=>{

e.preventDefault();

const name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();
const email=document.getElementById("email").value.trim();
const city=document.getElementById("city").value.trim();
const service=document.getElementById("service").value;
const budget=document.getElementById("budget").value;
const delivery=document.getElementById("delivery").value;
const requirement=document.getElementById("requirement").value.trim();

if(!name||!phone||!service||!requirement){
alert("Please fill all required fields.");
return;
}

if(!/^[0-9]{10}$/.test(phone)){
alert("Please enter a valid 10-digit WhatsApp number.");
return;
}

const btn=document.querySelector(".submit");
btn.disabled=true;
btn.textContent="⏳ Creating Order...";

try{

const response=await fetch("/api/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name,phone,email,city,service,budget,delivery,requirement
})
});

const data=await response.json();

if(!data.success){
throw new Error(data.message||"Order failed");
}

document.getElementById("success").style.display="block";
btn.textContent="✓ Order Created";

const message=
"🚀 *NEW ORDER - MAYUR SERVICES*%0A%0A"+
"🆔 Order ID: "+data.order.id+"%0A"+
"👤 Name: "+name+"%0A"+
"📱 WhatsApp: +91 "+phone+"%0A"+
"📧 Email: "+(email||"Not provided")+"%0A"+
"📍 City: "+(city||"Not provided")+"%0A"+
"🛠️ Service: "+service+"%0A"+
"💰 Budget: "+budget+"%0A"+
"⚡ Delivery: "+delivery+"%0A%0A"+
"📝 Requirement:%0A"+requirement;

setTimeout(()=>{
location.href=
"https://wa.me/919370155844?text="+
encodeURIComponent(message);
},900);

}catch(err){

btn.disabled=false;
btn.textContent="🚀 Submit Order & Continue";
alert(err.message||"Server error.");

}

});

</script>

</body>
</html>
